name: CI

# Builds the CRT-free ICS_Generate.exe with three toolchains, runs the unit
# tests, enforces the 96 KB size gate, proves that no CRT DLL is imported and
# publishes a GitHub Release when a v* tag is pushed.

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ICSG_SIZE_GATE_KB: '96'

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc-x64
            toolchain: msvc
            arch: x64
          - name: msvc-x86
            toolchain: msvc
            arch: Win32
          - name: mingw-x64
            toolchain: mingw
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ setup
      - name: Install MinGW-w64 (MSYS2)
        id: msys2
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Put MinGW-w64 on PATH
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mingw = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $gpp   = Join-Path $mingw 'g++.exe'
          $make  = Join-Path $mingw 'mingw32-make.exe'
          if (-not (Test-Path $gpp))  { throw "MinGW-w64 g++ was not found at $gpp" }
          if (-not (Test-Path $make)) { throw "mingw32-make was not found at $make" }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw -Encoding utf8
          & $gpp --version | Select-Object -First 1
          & $make --version | Select-Object -First 1

      # -------------------------------------------------------------- configure
      - name: Configure (MSVC ${{ matrix.arch }})
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release -DICSG_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

      - name: Configure (MinGW-w64 x64)
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DICSG_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

      # ------------------------------------------------------------------ build
      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'build/bin/ICS_Generate.exe')) { throw 'build/bin/ICS_Generate.exe was not produced' }

      # ------------------------------------------------------------------ tests
      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = 'build/bin/ics_core_tests.exe'
          if (-not (Test-Path $tests)) { throw "missing test runner: $tests" }
          & $tests
          if ($LASTEXITCODE -ne 0) { throw "ics_core_tests.exe failed with exit code $LASTEXITCODE" }
          Write-Host 'ics_core_tests.exe: PASS'

      # ------------------------------------------- size gate + CRT-free import
      - name: Size gate and CRT-free import check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/bin/ICS_Generate.exe'
          if (-not (Test-Path $exe)) { throw "missing executable: $exe" }

          $bytes  = (Get-Item $exe).Length
          $kb     = [math]::Round($bytes / 1KB, 2)
          $gateKb = [int]$env:ICSG_SIZE_GATE_KB

          # ---- import table: dumpbin for MSVC, objdump for MinGW ---------------
          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
            if (-not $pf86) { $pf86 = $env:ProgramFiles }
            $vswhere = Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found' }
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { throw 'no Visual Studio C++ toolset was found' }
            $dumpbin = Get-ChildItem (Join-Path $vsRoot.Trim() 'VC\Tools\MSVC') -Directory |
                       Sort-Object Name -Descending |
                       ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\dumpbin.exe' } |
                       Where-Object { Test-Path $_ } |
                       Select-Object -First 1
            if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
            $dump = (& $dumpbin /nologo /imports $exe | Out-String)
            $dlls = [regex]::Matches($dump, '(?m)^\s+(\S+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value }
          } else {
            $dump = (& objdump -p $exe | Out-String)
            $dlls = [regex]::Matches($dump, '(?m)^\s*DLL Name:\s*(\S+)') | ForEach-Object { $_.Groups[1].Value }
          }
          $dlls = @($dlls | Sort-Object -Unique)
          if ($dlls.Count -eq 0) { throw 'the import dump produced no DLL names - the check cannot be trusted' }

          # ---- no CRT, nothing outside the frozen whitelist --------------------
          $crtHits = @($dlls | Where-Object { $_ -match 'msvcrt|ucrtbase|ucrtbased|api-ms-win-crt|libgcc|libstdc\+\+|libwinpthread' })
          if ($crtHits.Count -gt 0) { throw "CRT import detected: $($crtHits -join ', ')" }

          $whitelist = @('KERNEL32.DLL', 'USER32.DLL', 'GDI32.DLL', 'COMCTL32.DLL', 'SHELL32.DLL',
                         'SHLWAPI.DLL', 'OLE32.DLL', 'COMDLG32.DLL', 'ADVAPI32.DLL', 'DWMAPI.DLL', 'UXTHEME.DLL')
          $outside = @($dlls | Where-Object { $whitelist -notcontains $_.ToUpperInvariant() })
          if ($outside.Count -gt 0) { throw "import outside the frozen whitelist: $($outside -join ', ')" }

          # ---- size gate -------------------------------------------------------
          if ($bytes -gt ($gateKb * 1KB)) {
            throw "size gate FAILED: $bytes bytes exceed the $gateKb KB limit"
          }

          Write-Host "ICS_Generate.exe: $bytes bytes ($kb KB), gate $gateKb KB - PASS"
          Write-Host "imports: $($dlls -join ', ')"

          # ---- machine readable size report for the release job ----------------
          Set-Content -Path build/bin/size.txt -Encoding ascii -Value @(
            "name=${{ matrix.name }}",
            "bytes=$bytes",
            "kb=$kb",
            "imports=" + ($dlls -join ','))

          # ---- job summary -----------------------------------------------------
          if ($env:GITHUB_STEP_SUMMARY) {
            $rows = @(
              "### ICS_Generate - ${{ matrix.name }}",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              "| Toolchain | ${{ matrix.toolchain }} / ${{ matrix.arch }} |",
              "| Configuration | Release |",
              "| Size | $bytes bytes ($kb KB) |",
              "| Product target | <= 64 KB |",
              "| Hard gate | <= $gateKb KB |",
              "| CRT import | none |",
              "| Imported DLLs | $($dlls.Count): $($dlls -join ', ') |",
              "| Unit tests | PASS |",
              "")
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $rows
          }

      # --------------------------------------------------------------- artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICS_Generate-${{ matrix.name }}
          path: |
            build/bin/ICS_Generate.exe
            build/bin/size.txt
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ release
  release:
    name: release-${{ github.ref_name }}
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect executables and size reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($dir in Get-ChildItem artifacts -Directory) {
            $exe = Get-ChildItem $dir.FullName -Recurse -Filter 'ICS_Generate.exe' | Select-Object -First 1
            if (-not $exe) { throw "no ICS_Generate.exe inside artifact $($dir.Name)" }
            $asset = Join-Path 'release' ($dir.Name + '.exe')
            Copy-Item $exe.FullName $asset
            Write-Host ("{0}: {1} bytes" -f $asset, $exe.Length)
            $size = Get-ChildItem $dir.FullName -Recurse -Filter 'size.txt' | Select-Object -First 1
            if ($size) { Copy-Item $size.FullName (Join-Path 'release' ($dir.Name + '.size.txt')) }
          }
          Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.size.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
